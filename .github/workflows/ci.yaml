name: app CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
    
permissions:
    contents: read

env:
  IMAGE_NAME: app
  IMAGE_TAG: ${{ github.sha }}

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
        - name: Checkout
          uses: actions/checkout@v7

        - name: Validando arquivos
          run: |
            pwd
            ls -la
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4
        - name: Build Dockerfile
          uses: docker/build-push-action@v7
          with:
            context: .
            file: ./docker/Dockerfile
            push: false
            load: true
            tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

        - name: Validando a imagem 
          run: |
            docker image ls
            docker container run --rm ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ls -la

        - name: Smoke Test Simples
          run: |
            docker container run -d -p 8080:80 --name app-container ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} 
            echo "aguardando a aplicação ..."
            for i in $(seq 1 15); do
                if curl -f http://localhost:8080; then
                    echo "Aplicação está respondendo tentativa $i"
                    exit 0
                fi
                sleep 2
            done
                echo "Aplicação não está respondendo"
                exit 1
            
            - name: Logs do container
              if: always()
              run: |
                docker logs app-container || true

            - name: Removendo container
              if: always()
              run: |
                docker container rm -f app-container || true


            


            
        

