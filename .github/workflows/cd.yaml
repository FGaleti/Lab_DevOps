name: app CD

on:
  workflow_run:
    workflows:
      - app CI
    types:
      - completed

  workflow_dispatch:

concurrency:
  group: app-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: app
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
  COMPOSE_FILE: docker/docker-compose.yaml
  CONTAINER_NAME: app-container
  APPLICATION_URL: http://localhost:8080

jobs:
  build-and-push:
    name: Build e publicação da imagem

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_KEY }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build e push da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy no runner self-hosted
    needs: build-and-push

    runs-on:
      - self-hosted
      - Linux
      - X64

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_KEY }}

      - name: Definir imagens do deployment
        shell: bash
        run: |
          NEW_IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          OLD_IMAGE="$(
            docker container inspect \
              --format '{{.Config.Image}}' \
              "${{ env.CONTAINER_NAME }}" \
              2>/dev/null || true
          )"

          echo "NEW_IMAGE=$NEW_IMAGE" >> "$GITHUB_ENV"
          echo "OLD_IMAGE=$OLD_IMAGE" >> "$GITHUB_ENV"

          echo "Nova imagem: $NEW_IMAGE"

          if [ -n "$OLD_IMAGE" ]; then
            echo "Imagem anterior: $OLD_IMAGE"
          else
            echo "Nenhuma imagem anterior encontrada."
            echo "Este será o primeiro deployment."
          fi

      - name: Verificar arquivo Docker Compose
        shell: bash
        run: |
          echo "Diretório atual:"
          pwd

          echo "Arquivo Compose:"
          ls -la "${{ env.COMPOSE_FILE }}"

          test -f "${{ env.COMPOSE_FILE }}"

      - name: Validar configuração do Docker Compose
        env:
          APP_IMAGE: ${{ env.NEW_IMAGE }}
        run: |
          docker compose \
            -f "${{ env.COMPOSE_FILE }}" \
            config

      - name: Baixar nova imagem
        run: |
          docker pull "${{ env.NEW_IMAGE }}"

      - name: Aplicar nova versão
        env:
          APP_IMAGE: ${{ env.NEW_IMAGE }}
        run: |
          docker compose \
            -f "${{ env.COMPOSE_FILE }}" \
            up -d \
            --force-recreate \
            --remove-orphans

      - name: Validar nova versão
        id: healthcheck
        shell: bash
        run: |
          echo "Validando aplicação em ${{ env.APPLICATION_URL }}"

          for attempt in $(seq 1 15); do
            echo "Tentativa $attempt de 15..."

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 5 \
              "${{ env.APPLICATION_URL }}" \
              > /dev/null; then

              echo "Aplicação validada com sucesso."
              exit 0
            fi

            sleep 2
          done

          echo "A nova versão não respondeu corretamente."
          exit 1

      - name: Exibir diagnóstico da nova versão
        if: failure() && steps.healthcheck.outcome == 'failure'
        shell: bash
        run: |
          echo "=== Containers ==="
          docker container ls -a

          echo "=== Logs do container ==="
          docker container logs \
            --tail 100 \
            "${{ env.CONTAINER_NAME }}" || true

          echo "=== Estado do container ==="
          docker container inspect \
            --format '{{json .State}}' \
            "${{ env.CONTAINER_NAME }}" || true

      - name: Executar rollback
        id: rollback
        if: failure() && steps.healthcheck.outcome == 'failure'
        shell: bash
        run: |
          if [ -z "${{ env.OLD_IMAGE }}" ]; then
            echo "Não existe uma versão anterior para rollback."
            echo "Removendo o primeiro deployment com falha."

            APP_IMAGE="${{ env.NEW_IMAGE }}" \
              docker compose \
                -f "${{ env.COMPOSE_FILE }}" \
                down || true

            exit 1
          fi

          echo "Restaurando imagem anterior:"
          echo "${{ env.OLD_IMAGE }}"

          docker pull "${{ env.OLD_IMAGE }}" || true

          APP_IMAGE="${{ env.OLD_IMAGE }}" \
            docker compose \
              -f "${{ env.COMPOSE_FILE }}" \
              up -d \
              --force-recreate \
              --remove-orphans

          echo "Validando a versão restaurada..."

          for attempt in $(seq 1 15); do
            echo "Tentativa de rollback $attempt de 15..."

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 5 \
              "${{ env.APPLICATION_URL }}" \
              > /dev/null; then

              echo "Rollback concluído e validado."
              exit 0
            fi

            sleep 2
          done

          echo "A versão anterior também não respondeu corretamente."

          docker container logs \
            --tail 100 \
            "${{ env.CONTAINER_NAME }}" || true

          exit 1

      - name: Exibir estado final
        if: always()
        shell: bash
        run: |
          echo "=== Containers existentes ==="
          docker container ls -a

          echo "=== Imagem atualmente configurada ==="
          docker container inspect \
            --format '{{.Config.Image}}' \
            "${{ env.CONTAINER_NAME }}" \
            2>/dev/null || echo "Container não encontrado"

          echo "=== Estado do container ==="
          docker container inspect \
            --format '{{.State.Status}}' \
            "${{ env.CONTAINER_NAME }}" \
            2>/dev/null || true

          echo "=== Estado do healthcheck interno ==="
          docker container inspect \
            --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}Healthcheck não definido{{end}}' \
            "${{ env.CONTAINER_NAME }}" \
            2>/dev/null || true