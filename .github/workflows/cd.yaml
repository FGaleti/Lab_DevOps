name: app CD

on:
  workflow_run:
    workflows:
      - app CI
    types:
      - completed

  workflow_dispatch:

concurrency:
  group: app-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: app
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
  COMPOSE_FILE: docker/compose.yaml
  CONTAINER_NAME: app-container
  APPLICATION_URL: http://localhost:8080

jobs:
  build-and-push:
    name: Build e publicação da imagem
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_KEY }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build e push da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
    name: Deployment com Docker Compose
    needs:
      - build-and-push

    runs-on:
      - self-hosted
      - Linux
      - X64

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_KEY }}

      - name: Definir imagens do deployment
        run: |
          NEW_IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          OLD_IMAGE="$(
            docker container inspect \
              --format '{{.Config.Image}}' \
              "${{ env.CONTAINER_NAME }}" \
              2>/dev/null || true
          )"

          echo "NEW_IMAGE=$NEW_IMAGE" >> "$GITHUB_ENV"
          echo "OLD_IMAGE=$OLD_IMAGE" >> "$GITHUB_ENV"

          echo "Nova imagem: $NEW_IMAGE"

          if [ -n "$OLD_IMAGE" ]; then
            echo "Imagem anterior: $OLD_IMAGE"
          else
            echo "Nenhuma versão anterior foi encontrada"
          fi

      - name: Validar Docker Compose
        env:
          APP_IMAGE: ${{ env.NEW_IMAGE }}
        run: |
          docker compose \
            -f "${{ env.COMPOSE_FILE }}" \
            config

      - name: Baixar nova imagem
        run: |
          docker pull "${{ env.NEW_IMAGE }}"

      - name: Aplicar nova versão
        env:
          APP_IMAGE: ${{ env.NEW_IMAGE }}
        run: |
          docker compose \
            -f "${{ env.COMPOSE_FILE }}" \
            up -d \
            --force-recreate \
            --remove-orphans

      - name: Health check e rollback
        shell: bash
        env:
          APP_IMAGE: ${{ env.NEW_IMAGE }}
        run: |
          set -u

          echo "Validando a aplicação em ${{ env.APPLICATION_URL }}"

          HEALTHY=false

          for attempt in $(seq 1 15); do
            echo "Tentativa $attempt de 15..."

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 5 \
              "${{ env.APPLICATION_URL }}" \
              > /dev/null; then

              HEALTHY=true
              echo "Aplicação validada com sucesso."
              break
            fi

            sleep 2
          done

          if [ "$HEALTHY" = "true" ]; then
            exit 0
          fi

          echo "Health check da nova versão falhou."
          echo "Logs da nova versão:"

          docker container logs \
            --tail 100 \
            "${{ env.CONTAINER_NAME }}" || true

          if [ -z "${{ env.OLD_IMAGE }}" ]; then
            echo "Não existe uma imagem anterior para rollback."

            docker compose \
              -f "${{ env.COMPOSE_FILE }}" \
              down || true

            exit 1
          fi

          echo "Iniciando rollback para: ${{ env.OLD_IMAGE }}"

          docker pull "${{ env.OLD_IMAGE }}" || true

          APP_IMAGE="${{ env.OLD_IMAGE }}" \
            docker compose \
              -f "${{ env.COMPOSE_FILE }}" \
              up -d \
              --force-recreate \
              --remove-orphans

          echo "Validando a versão restaurada..."

          ROLLBACK_HEALTHY=false

          for attempt in $(seq 1 15); do
            echo "Tentativa de rollback $attempt de 15..."

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 5 \
              "${{ env.APPLICATION_URL }}" \
              > /dev/null; then

              ROLLBACK_HEALTHY=true
              echo "Rollback concluído e validado."
              break
            fi

            sleep 2
          done

          if [ "$ROLLBACK_HEALTHY" != "true" ]; then
            echo "A versão restaurada também não passou no health check."

            docker container logs \
              --tail 100 \
              "${{ env.CONTAINER_NAME }}" || true
          fi

          exit 1

      - name: Estado final do deployment
        if: always()
        run: |
          echo "=== Containers ==="
          docker container ls -a

          echo "=== Imagem aplicada ==="
          docker container inspect \
            --format '{{.Config.Image}}' \
            "${{ env.CONTAINER_NAME }}" \
            2>/dev/null || echo "Container não encontrado"

          echo "=== Estado de saúde ==="
          docker container inspect \
            --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}healthcheck indisponível{{end}}' \
            "${{ env.CONTAINER_NAME }}" \
            2>/dev/null || true